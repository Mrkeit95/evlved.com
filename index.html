<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EVLVED — The Launch</title>
<meta name="description" content="EVLVED. Four systems. About to be available. Sign up to be the first to know." />

<!-- Open Graph -->
<meta property="og:title" content="EVLVED — The Launch" />
<meta property="og:description" content="Everything I've learned about discipline, fitness, travel, and money. About to be available." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://evlved.com" />

<!-- Favicon (gold mountain mark) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-50 -32 100 60'%3E%3Cpolyline points='-44,18 0,-26 44,18' fill='none' stroke='%23c9a961' stroke-width='3' stroke-linecap='square' stroke-linejoin='miter'/%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #0a0a0a;
    --bg-soft: #131313;
    --ink: #f4efe6;
    --ink-soft: rgba(244, 239, 230, 0.78);
    --ink-dim: rgba(244, 239, 230, 0.5);
    --ink-faint: rgba(244, 239, 230, 0.18);
    --gold: #c9a961;
    --gold-soft: rgba(201, 169, 97, 0.25);
    --gold-faint: rgba(201, 169, 97, 0.08);
    --line: rgba(244, 239, 230, 0.08);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-weight: 300;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(201, 169, 97, 0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(201, 169, 97, 0.03) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 32px 48px;
    z-index: 1;
  }

  /* TOP BAR */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .top-left {
    font-size: 11px;
    letter-spacing: 0.5em;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 500;
  }
  .top-right {
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--ink-dim);
    text-transform: uppercase;
    font-weight: 400;
  }

  /* MAIN */
  .main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    animation: fadeUp 1.4s var(--ease) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .mark {
    width: 110px;
    margin-bottom: 56px;
    opacity: 0;
    animation: fadeIn 1.8s var(--ease) 0.2s forwards;
  }
  .mark svg { width: 100%; display: block; }

  @keyframes fadeIn { to { opacity: 1; } }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.55em;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 32px;
    padding-left: 0.55em;
    position: relative;
  }
  .eyebrow::before,
  .eyebrow::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 32px;
    height: 1px;
    background: var(--gold);
    opacity: 0.4;
  }
  .eyebrow::before { left: -52px; }
  .eyebrow::after { right: -52px; }

  .subhead {
    font-size: 19px;
    line-height: 1.55;
    color: var(--ink-soft);
    font-weight: 300;
    max-width: 560px;
    margin: 0 auto 48px;
    letter-spacing: 0.005em;
  }
  .subhead em {
    font-style: italic;
    color: var(--gold);
    font-weight: 300;
  }

  /* FORM */
  .form-block {
    width: 100%;
    max-width: 440px;
  }
  .form-label {
    font-size: 10px;
    letter-spacing: 0.5em;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 16px;
    padding-left: 0.5em;
  }

  .signup-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .signup-form input[type="email"] {
    width: 100%;
    background: rgba(244, 239, 230, 0.04);
    border: 1px solid var(--gold-soft);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 300;
    padding: 16px 20px;
    letter-spacing: 0.02em;
    transition: border-color 0.3s var(--ease), background 0.3s var(--ease);
    text-align: center;
  }
  .signup-form input[type="email"]:focus {
    outline: none;
    border-color: var(--gold);
    background: rgba(244, 239, 230, 0.06);
  }
  .signup-form input::placeholder {
    color: var(--ink-dim);
    letter-spacing: 0.02em;
  }
  .signup-form button {
    width: 100%;
    background: var(--gold);
    color: var(--bg);
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    padding: 16px 20px;
    cursor: pointer;
    transition: background 0.3s var(--ease);
  }
  .signup-form button:hover { background: #d4b46d; }
  .signup-form button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .form-message {
    margin-top: 16px;
    font-size: 13px;
    line-height: 1.5;
    letter-spacing: 0.02em;
    text-align: center;
    min-height: 20px;
  }
  .form-message.success { color: var(--gold); }
  .form-message.error { color: #e08877; }

  /* BOTTOM */
  .bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding-top: 32px;
  }
  .bottom-line {
    width: 32px;
    height: 1px;
    background: var(--gold);
    opacity: 0.4;
  }
  .bottom-text {
    font-size: 10px;
    letter-spacing: 0.55em;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 500;
    padding-left: 0.55em;
  }

  /* MOBILE */
  @media (max-width: 720px) {
    .page { padding: 24px 24px; }
    .top-left { font-size: 10px; }
    .top-right { font-size: 9px; letter-spacing: 0.35em; }
    .mark { width: 80px; margin-bottom: 40px; }
    .eyebrow { font-size: 10px; letter-spacing: 0.5em; margin-bottom: 24px; }
    .eyebrow::before, .eyebrow::after { display: none; }
    .subhead { font-size: 16px; margin-bottom: 36px; }
    .form-label { font-size: 9px; }
    .bottom-text { font-size: 9px; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- TOP -->
  <div class="top">
    <div class="top-left">EVLVED</div>
    <div class="top-right">Vol. 01 &mdash; 04</div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="mark">
      <svg viewBox="-50 -32 100 60" xmlns="http://www.w3.org/2000/svg">
        <polyline points="-44,18 0,-26 44,18" fill="none" stroke="#c9a961" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter"/>
        <polyline points="-30,8 0,-22 30,8" fill="none" stroke="#c9a961" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" opacity="0.7"/>
        <polyline points="-16,-2 0,-18 16,-2" fill="none" stroke="#c9a961" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" opacity="0.45"/>
      </svg>
    </div>

    <div class="eyebrow">The Launch</div>

    <p class="subhead">Everything I&rsquo;ve learned about discipline, fitness, travel, and money. <em>About to be available.</em></p>

    <div class="form-block">
      <div class="form-label">Be First To Know</div>

      <form class="signup-form" id="signupForm" action="https://app.kit.com/forms/9428673/subscriptions" method="post">
        <input type="email" name="email_address" placeholder="your@email.com" required aria-label="Email address" />
        <button type="submit" id="submitBtn">Notify Me</button>
      </form>

      <div class="form-message" id="formMessage"></div>
    </div>
  </div>

  <!-- BOTTOM -->
  <div class="bottom">
    <div class="bottom-line"></div>
    <div class="bottom-text">Coming Soon &middot; evlved.com</div>
  </div>

</div>

<script>
  document.getElementById('signupForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var form = e.target;
    var btn = document.getElementById('submitBtn');
    var msg = document.getElementById('formMessage');
    var email = form.querySelector('input[name="email_address"]').value.trim();

    if (!email) return;

    btn.disabled = true;
    btn.textContent = 'Submitting...';
    msg.textContent = '';
    msg.className = 'form-message';

    try {
      var formData = new FormData();
      formData.append('email_address', email);

      await fetch(form.action, {
        method: 'POST',
        body: formData,
        mode: 'no-cors'
      });

      msg.innerHTML = 'Check your email to confirm. <br>If you don\'t see it, check your spam folder.';
      msg.className = 'form-message success';
      form.reset();
      btn.textContent = 'Notify Me';
      btn.disabled = false;
    } catch (err) {
      msg.textContent = 'Something went wrong. Try again.';
      msg.className = 'form-message error';
      btn.textContent = 'Notify Me';
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
